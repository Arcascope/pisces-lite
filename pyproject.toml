[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisces-lite"
version = "3.0.0"
description = "ML-backend-agnostic core supporting data set discovery, loading, common spectrogram/PSD-based processing, and CV scoring."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arcascope Inc", email = "support@arcascope.com" }]
requires-python = ">=3.12"
keywords = ["sleep", "actigraphy", "accelerometer", "spectrogram", "wearables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

# senpy is deliberately NOT here. It is a compiled extension (pybind11 +
# finufft) and is only ever used by pisces_lite.proc, which turns raw
# accelerometer data into spectrograms. A consumer working from an already
# built feature cache -- a training or inference host -- imports cv, metrics,
# model_io and ProcessingConfig but never calls into proc, so making it a hard
# dependency forced a C++ toolchain into images that had nothing to compile.
# Install "pisces-lite[proc]" to do the processing itself.
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
# The processing pipeline: pisces_lite.proc's runtime backend.
# The distribution is named `arcascope-senpy`; its import name is `senpy`.
# (There is an unrelated `senpy` project on PyPI, hence the prefixed name.)
proc = [
    "arcascope-senpy==4.0.3",
]
# proc on a JAX NUFFT backend. Superset of [proc]; arcascope-senpy[jax] covers it.
jax = [
    "arcascope-senpy[jax]==4.0.3",
]

[project.urls]
Homepage = "https://github.com/Arcascope/pisces-lite"
Repository = "https://github.com/Arcascope/pisces-lite"
Issues = "https://github.com/Arcascope/pisces-lite/issues"

[tool.setuptools.packages.find]
where = ["src"]
