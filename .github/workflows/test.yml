name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Base install only: the [proc] backend tests importorskip, so this job
      # validates the framework-agnostic core across supported Pythons even if
      # the backend is unavailable for one of them.
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q

  test-proc:
    name: Test with processing backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arcascope-senpy ships cp312/cp313/cp314 wheels.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with proc and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[proc,dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
