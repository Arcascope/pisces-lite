name: release

# Builds and publishes to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret
# is stored. PyPI must have a publisher configured for this repository and the
# workflow filename below (`release.yml`), optionally bound to the `pypi`
# environment. See https://docs.pypi.org/trusted-publishers/.

on:
  release:
    types: [published]
  # Manual dry runs against TestPyPI. Use the "Run workflow" button.
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run the test suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/"*.whl pytest
          python -m pytest tests/ -q

  pypi-publish:
    name: Upload release to PyPI
    needs: [build, test]
    # Only publish for real releases, or an explicit manual run.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Required for OIDC token minting; strongly recommended to scope it here.
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.testpypi)
        uses: pypa/gh-action-pypi-publish@release/v1
