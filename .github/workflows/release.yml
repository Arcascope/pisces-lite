name: release

# Builds and publishes pisces-lite to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret is
# stored. PyPI must have a publisher configured for this repository and the
# workflow filename below (`release.yml`), bound to the `pypi` environment.
# See https://docs.pypi.org/trusted-publishers/.
#
# For a TestPyPI dry run, use the separate "dry-run-testpypi" workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run the test suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/"*.whl pytest
          python -m pytest tests/ -q

  pypi-publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pisces-lite
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: List distributions
        run: ls -lh dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
